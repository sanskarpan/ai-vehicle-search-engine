name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m vehicle_search.evaluate --dataset data/golden_queries.jsonl
      - run: python -m vehicle_search.evaluate --dataset data/heldout_queries.jsonl

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ai-vehicle-search:test
      - name: Smoke-test the production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name vehicle-search-ci --publish 8000:8000 ai-vehicle-search:test
          trap 'docker rm --force vehicle-search-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/ready.json; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs vehicle-search-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec vehicle-search-ci id -u)" != "0"
          curl --fail --silent http://127.0.0.1:8000/ --output /tmp/index.html
          grep --fixed-strings 'Autofinder' /tmp/index.html > /dev/null
          curl --fail --silent http://127.0.0.1:8000/openapi.json --output /tmp/openapi.json
          python3 -c 'import json; assert "/api/v1/search" in json.load(open("/tmp/openapi.json"))["paths"]'
          curl --fail --silent http://127.0.0.1:8000/api/v1/search \
            --header 'content-type: application/json' \
            --data '{"query":"Diesel automatic cars below 80k km","limit":5}' \
            --output /tmp/search.json
          python3 -c 'import json; p=json.load(open("/tmp/search.json")); assert p["status"] == "ok" and p["results"]'
