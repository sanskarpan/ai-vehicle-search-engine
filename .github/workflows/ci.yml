name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m vehicle_search.evaluate --dataset data/golden_queries.jsonl
      - run: python -m vehicle_search.evaluate --dataset data/heldout_queries.jsonl

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-vehicle-search:test
