[project]
name = "ai-vehicle-search"
version = "0.1.0"
description = "Natural-language search over a synthetic vehicle catalogue"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[project.scripts]
vehicle-seed = "vehicle_search.seed:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
vehicle_search = ["parsing/prompt.txt"]

[tool.ruff]
line-length = 100
